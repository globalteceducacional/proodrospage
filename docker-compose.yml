# O container só aparece no host em 127.0.0.1:8090.
# O Nginx do Ubuntu encaminha https://proodos.luditeca.com para essa porta.
# Portas já usadas na VPS: 3000, 3001, 3150, 3306, 4000, 5173, 8080, 9000.
services:
  web:
    build: .
    image: proodos-site
    container_name: proodos-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
